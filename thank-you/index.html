<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Thank You — Roami Travel</title>
<meta name="description" content="Thank you for downloading your free China Travel Starter Kit!">
<meta name="robots" content="noindex, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--teal:#0f766e;--teal-dark:#0d6b63;--teal-glow:rgba(15,118,110,0.08);--gray-900:#1a1a1a;--gray-600:#666;--gray-400:#999;--border:#e5e7eb}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--gray-900);background:#f8f9fa;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.container{max-width:640px;width:100%;background:white;border-radius:16px;padding:48px 32px;box-shadow:0 4px 24px rgba(0,0,0,0.06);text-align:center}
.icon{width:64px;height:64px;background:var(--teal-glow);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:32px}
h1{font-size:28px;font-weight:700;margin-bottom:12px;color:var(--gray-900)}
.subtitle{font-size:16px;color:var(--gray-600);line-height:1.6;margin-bottom:32px}
.download-box{background:var(--teal-glow);border-radius:12px;padding:24px;margin-bottom:32px}
.download-box p{font-size:15px;color:var(--gray-600);margin-bottom:16px}
.download-btn{display:inline-block;padding:14px 32px;font-size:16px;font-weight:600;background:var(--teal);color:white;border-radius:10px;text-decoration:none;transition:background 0.2s}
.download-btn:hover{background:var(--teal-dark)}
.cta{margin-bottom:24px}
.cta p{font-size:15px;color:var(--gray-600);line-height:1.6;margin-bottom:16px}
.cta-link{color:var(--teal);font-weight:600;text-decoration:none;font-size:16px}
.cta-link:hover{text-decoration:underline}
.footer{margin-top:32px;padding-top:24px;border-top:1px solid var(--border);font-size:13px;color:var(--gray-400)}
.footer a{color:var(--teal);text-decoration:none}
@media(max-width:640px){
.container{padding:32px 20px}
h1{font-size:24px}
.subtitle{font-size:15px}
}
</style>
</head>
<body>
<div class="container">
<div class="icon">✓</div>
<h1>Thank You!</h1>
<p class="subtitle">Your China Travel Starter Kit is on its way to your inbox.<br>If the download doesn't start automatically, click below:</p>

<div class="download-box">
<p>📦 Didn't get the PDF? No problem!</p>
<a href="/downloads/starter-kit.pdf" download="Roami-China-Starter-Kit.pdf" class="download-btn" id="manualDownload">Download Now</a>
</div>

<div class="cta">
<p>Want a personalized travel plan for your China trip?</p>
<a href="/" class="cta-link">Explore Roami Travel →</a>
</div>

<div class="footer">
Questions? <a href="mailto:hello@roamitravel.com">hello@roamitravel.com</a>
</div>
</div>

<script>
// 手动下载按钮记录转化事件
document.getElementById('manualDownload').addEventListener('click', function(e) {
  if (typeof gtag === 'function') {
    gtag('event', 'conversion', {
      'send_to': 'AW-18518352623/REPLACE_WITH_CONVERSION_LABEL',
      'value': 0.0,
      'currency': 'CNY'
    });
  }
});
</script>
</body>
</html>
