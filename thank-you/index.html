<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You! | Roami Travel</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/styles/main.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18518352623"></script>
  <script src="/scripts/ga4.js"></script>
  <style>
    .ty-wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: var(--space-xl) var(--space-md);
      text-align: center;
    }
    .ty-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-md);
      font-size: 1.75rem;
      box-shadow: 0 8px 24px rgba(15,118,110,0.2);
    }
    .ty-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--color-ink);
      margin-bottom: 8px;
    }
    .ty-subtitle {
      font-size: 1rem;
      color: var(--color-text);
      margin-bottom: var(--space-lg);
      line-height: 1.6;
    }

    /* Order Summary */
    .ty-order {
      background: #fff;
      border-radius: 16px;
      padding: var(--space-md);
      margin-bottom: var(--space-lg);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
      text-align: left;
    }
    .ty-order-top {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
      margin-bottom: 12px;
    }
    .ty-order-emoji { font-size: 1.5rem; }
    .ty-order-name { font-size: 1rem; font-weight: 700; color: var(--color-ink); flex: 1; }
    .ty-order-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #ecfdf5;
      color: #059669;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .ty-order-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }
    .ty-order-detail {
      font-size: 0.875rem;
      color: var(--color-text);
      line-height: 1.6;
    }
    .ty-order-detail p { margin: 0 0 4px; }
    .ty-order-detail strong { color: var(--color-ink); }

    /* Download */
    .ty-download { margin-bottom: var(--space-lg); }
    .ty-dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(15,118,110,0.25);
    }
    .ty-dl-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(15,118,110,0.35);
    }
    .ty-dl-hint {
      font-size: 0.8125rem;
      color: var(--color-text-light);
      margin-top: 8px;
    }

    /* Upgrade Section */
    .ty-upgrade {
      background: linear-gradient(135deg, #f0fdfa, #ecfeff);
      border-radius: 16px;
      padding: var(--space-lg);
      border: 1px solid rgba(15,118,110,0.1);
    }
    .ty-upgrade-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--color-ink);
      margin-bottom: 4px;
    }
    .ty-upgrade-sub {
      font-size: 0.8125rem;
      color: var(--color-text);
      margin-bottom: var(--space-md);
    }

    /* Symmetric 2-column grid */
    .ty-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-md);
    }
    @media (max-width: 520px) {
      .ty-grid { grid-template-columns: 1fr; }
    }
    .ty-card {
      background: #fff;
      border-radius: 12px;
      padding: var(--space-md);
      text-align: center;
      border: 1px solid #e2e8f0;
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
    }
    .ty-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .ty-card--hot {
      border-color: var(--color-primary);
      position: relative;
    }
    .ty-card--hot::after {
      content: 'Popular';
      position: absolute;
      top: -9px;
      right: 12px;
      background: var(--color-primary);
      color: #fff;
      font-size: 0.625rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .ty-card-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    .ty-card-name {
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--color-ink);
      margin-bottom: 2px;
    }
    .ty-card-price {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 8px;
    }
    .ty-card-desc {
      font-size: 0.8125rem;
      color: var(--color-text);
      line-height: 1.5;
      flex: 1;
      margin-bottom: 12px;
    }
    .ty-card-link {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--color-primary);
      text-decoration: none;
      padding: 8px;
      border-radius: 8px;
      background: rgba(15,118,110,0.06);
      transition: background 0.15s;
    }
    .ty-card-link:hover {
      background: rgba(15,118,110,0.12);
    }

    /* Help Footer */
    .ty-help {
      margin-top: var(--space-lg);
      padding-top: var(--space-md);
      border-top: 1px solid #e2e8f0;
      font-size: 0.8125rem;
      color: var(--color-text-light);
    }
    .ty-help a {
      color: var(--color-primary);
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a href="/" class="logo" aria-label="Roami Travel Home">🌏 Roami Travel</a>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
        <nav class="main-nav" aria-label="Main navigation">
          <ul class="nav-list">
            <li><a href="/">Home</a></li>
            <li><a href="/starter-kit/">Starter Kit</a></li>
            <li><a href="/about/">About</a></li>
            <li><a href="mailto:hello@roamitravel.com">Contact</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <main id="ty-main"></main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <ul class="footer-links">
          <li><a href="/privacy/">Privacy Policy</a></li>
          <li><a href="/terms/">Terms of Service</a></li>
          <li><a href="/about/">About Us</a></li>
          <li><a href="/starter-kit/">Free Starter Kit</a></li>
        </ul>
        <p class="footer-copyright">&copy; 2026 Roami Travel. All rights reserved. | <a href="mailto:hello@roamitravel.com" style="color:#94a3b8;">hello@roamitravel.com</a></p>
      </div>
    </div>
  </footer>

  <script src="/scripts/main.js"></script>
  <script>
    const PRODUCTS = {
      'starter-kit': {
        emoji: '📘',
        name: 'Shenzhen Starter Kit',
        tagline: 'Your free travel guide is on its way!',
        delivery: 'Check your email for the download link. It should arrive within 2-3 minutes.',
        download: '/downloads/starter-kit.pdf',
        downloadLabel: 'Download Starter Kit PDF',
        autoDownload: true,
        trackKey: 'starterKit',
        cards: [
          { icon: '🗺️', name: 'Shenzhen Playbook', price: '$19', desc: '12 walking routes, 51 POIs with verified hours, interactive maps, PWA offline mode.', link: 'https://playbook.roamitravel.com/', hot: true },
          { icon: '🎯', name: 'Custom Itinerary', price: '$69', desc: 'A personal 1-3 day plan built around your dates, interests, and travel pace.', link: '/order/personalized/' }
        ]
      },
      'playbook': {
        emoji: '🗺️',
        name: 'Shenzhen Playbook',
        tagline: 'Your interactive guide is ready!',
        delivery: 'A confirmation email with your access instructions is on its way.',
        download: null,
        accessLink: 'https://playbook.roamitravel.com/',
        autoDownload: false,
        trackKey: 'playbook',
        cards: [
          { icon: '🎯', name: 'Custom Itinerary', price: '$69', desc: 'A personal 1-3 day plan built around your dates, interests, and travel pace.', link: '/order/personalized/' },
          { icon: '🧳', name: 'Shenzhen Companion', price: '$129', desc: 'Full 4-7 day itinerary with 12 walking routes, priority support, and offline maps.', link: '/order/companion/', hot: true }
        ]
      },
      'personalized': {
        emoji: '🎯',
        name: 'Custom Itinerary',
        tagline: 'We\'ve received your order!',
        delivery: null,
        download: null,
        autoDownload: false,
        trackKey: 'personalized',
        steps: [
          'Check your email for our travel details form',
          'Fill in your dates, interests, and preferences',
          'We\'ll craft and deliver your plan within 24 hours'
        ],
        cards: [
          { icon: '🗺️', name: 'Shenzhen Playbook', price: '$19', desc: 'Explore 12 walking routes and 51 verified POIs while waiting for your plan.', link: 'https://playbook.roamitravel.com/', hot: true },
          { icon: '🧳', name: 'Shenzhen Companion', price: '$129', desc: 'Full 4-7 day itinerary with priority 2-hour support and offline maps.', link: '/order/companion/' }
        ]
      },
      'companion': {
        emoji: '🧳',
        name: 'Shenzhen Companion',
        tagline: 'We\'ve received your order!',
        delivery: null,
        download: null,
        autoDownload: false,
        trackKey: 'companion',
        steps: [
          'Check your email for our detailed preferences form',
          'Tell us your dates, interests, and any special requests',
          'We\'ll deliver your full itinerary within 24 hours'
        ],
        cards: [
          { icon: '🗺️', name: 'Shenzhen Playbook', price: '$19', desc: 'Explore 12 walking routes while our team builds your Companion plan.', link: 'https://playbook.roamitravel.com/', hot: true },
          { icon: '🎯', name: 'Custom Itinerary', price: '$69', desc: 'Know a travel companion? Give them their own custom plan.', link: '/order/personalized/' }
        ]
      }
    };

    function render() {
      const params = new URLSearchParams(window.location.search);
      const key = params.get('product') || 'starter-kit';
      const p = PRODUCTS[key] || PRODUCTS['starter-kit'];

      // Order detail
      let orderBody;
      if (p.steps) {
        orderBody = `<ol style="padding-left:18px;margin:6px 0 0;">${p.steps.map(s => `<li style="margin-bottom:4px;">${s}</li>`).join('')}</ol>`;
      } else {
        orderBody = `<p>${p.delivery}</p>`;
      }

      // Download / Access
      let dlHtml = '';
      if (p.download) {
        dlHtml = `
          <div class="ty-download">
            <a href="${p.download}" class="ty-dl-btn" data-track="${p.trackKey}">📥 ${p.downloadLabel}</a>
            <p class="ty-dl-hint">Or check your email for the download link</p>
          </div>`;
      } else if (p.accessLink) {
        dlHtml = `
          <div class="ty-download">
            <a href="${p.accessLink}" class="ty-dl-btn">🔓 Access Your Playbook</a>
            <p class="ty-dl-hint">Or check your email for the access link</p>
          </div>`;
      }

      // Cards
      const cardsHtml = p.cards.map(c => `
        <div class="ty-card${c.hot ? ' ty-card--hot' : ''}">
          <div class="ty-card-icon">${c.icon}</div>
          <div class="ty-card-name">${c.name}</div>
          <div class="ty-card-price">${c.price}</div>
          <div class="ty-card-desc">${c.desc}</div>
          <a href="${c.link}" class="ty-card-link">Learn more →</a>
        </div>
      `).join('');

      document.getElementById('ty-main').innerHTML = `
        <div class="ty-wrap">
          <div class="ty-icon">${p.emoji}</div>
          <h1 class="ty-title">Thank You!</h1>
          <p class="ty-subtitle">${p.tagline}</p>

          <div class="ty-order">
            <div class="ty-order-top">
              <span class="ty-order-emoji">${p.emoji}</span>
              <span class="ty-order-name">${p.name}</span>
              <span class="ty-order-badge">Received</span>
            </div>
            <div class="ty-order-detail">${orderBody}</div>
          </div>

          ${dlHtml}

          <div class="ty-upgrade">
            <div class="ty-upgrade-title">🚀 Level Up Your Trip</div>
            <div class="ty-upgrade-sub">Get more out of your Shenzhen adventure</div>
            <div class="ty-grid">${cardsHtml}</div>
          </div>

          <div class="ty-help">
            Questions? <a href="mailto:hello@roamitravel.com">hello@roamitravel.com</a>
          </div>
        </div>
      `;

      // Track conversion
      if (typeof window.trackConversion === 'function') {
        window.trackConversion(p.trackKey);
      }

      // Auto-download for Starter Kit
      if (p.autoDownload && p.download) {
        setTimeout(function() {
          const link = document.createElement('a');
          link.href = p.download;
          link.download = 'Roami-China-Travel-Starter-Kit.pdf';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }, 500);
      }
    }

    document.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
