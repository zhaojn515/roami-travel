<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Roami Travel</title>
<meta name="robots" content="noindex">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --color-bg: #0a0e1a;
  --color-teal: #0f766e;
  --color-teal-light: #14b8a6;
  --color-teal-glow: rgba(20, 184, 166, 0.12);
  --color-text: #e2e8f0;
  --color-text-muted: #94a3b8;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
html, body {
  height: 100%; font-family: var(--font);
  background: var(--color-bg); color: var(--color-text);
  -webkit-font-smoothing: antialiased;
}
body {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px; text-align: center;
  position: relative; overflow: hidden;
}
/* Subtle glow */
body::before {
  content: ''; position: absolute; top: 30%; left: 50%;
  transform: translate(-50%, -50%);
  width: 600px; height: 600px;
  background: radial-gradient(circle, var(--color-teal-glow) 0%, transparent 70%);
  border-radius: 50%;
}
.content { position: relative; z-index: 2; max-width: 480px; }
.error-code {
  font-size: clamp(80px, 15vw, 140px); font-weight: 800;
  letter-spacing: -4px; line-height: 1;
  background: linear-gradient(135deg, var(--color-teal-light) 0%, #818cf8 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; margin-bottom: 16px;
}
.error-title {
  font-size: clamp(20px, 3vw, 28px); font-weight: 700;
  margin-bottom: 12px;
}
.error-desc {
  font-size: 16px; color: var(--color-text-muted); line-height: 1.7;
  margin-bottom: 36px;
}
.actions { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 13px 24px; border-radius: 10px;
  font-size: 14px; font-weight: 600; text-decoration: none;
  transition: all 0.2s ease;
}
.btn-primary {
  background: var(--color-teal); color: white;
  box-shadow: 0 2px 12px rgba(15, 118, 110, 0.3);
}
.btn-primary:hover { background: #0d6b63; transform: translateY(-1px); }
.btn-ghost {
  background: rgba(255,255,255,0.05); color: var(--color-text);
  border: 1px solid rgba(255,255,255,0.1);
}
.btn-ghost:hover { background: rgba(255,255,255,0.08); }
.footer-note {
  position: absolute; bottom: 24px;
  font-size: 13px; color: var(--color-text-muted);
}
.footer-note a { color: var(--color-teal-light); }
</style>
</head>
<body>
  <div class="content">
    <div class="error-code">404</div>
    <h1 class="error-title">This page took a wrong turn</h1>
    <p class="error-desc">
      Looks like you've wandered off the map. The page you're looking for doesn't exist — but your next adventure is just around the corner.
    </p>
    <div class="actions">
      <a href="/" class="btn btn-primary">← Back to Home</a>
      <a href="/i/demo-alex/" class="btn btn-ghost">View Sample Itinerary</a>
    </div>
  </div>
  <div class="footer-note">
    <svg viewBox="0 0 32 32" width="20" height="20" fill="none" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="14.5" stroke="#0f766e" stroke-width="1.6"/><path d="M16 0.5 L17.6 4.2 L14.4 4.2 Z" fill="#fbbf24"/><path d="M16 31.5 L17.2 28.4 L14.8 28.4 Z M0.5 16 L4.2 14.4 L4.2 17.6 Z M31.5 16 L27.8 14.4 L27.8 17.6 Z" fill="#0f766e" opacity="0.55"/><path fill="#0f766e" d="M10.2 8.2h6.6c2.5 0 4.1 1.5 4.1 3.6 0 1.7-1.0 3.0-2.6 3.4L22.4 24h-3.3l-4.1-9.1H12.6V24h-2.4V8.2zm2.4 2.2v5.8h3.8c1.4 0 2.1-.85 2.1-1.9 0-1.05-.7-1.9-2.1-1.9h-3.8z"/></svg> <a href="/">Roami Travel</a> · Shenzhen, China
  </div>
</body>
</html>
