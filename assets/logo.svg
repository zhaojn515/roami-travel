<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Roami">
  <!-- Roami brand mark: compass ring with stylized R and north-pointer accent.
       Use currentColor on <svg> (or parent color) to tint for light/dark backgrounds. -->
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <!-- North pointer (amber accent) -->
  <path d="M16 0.5 L17.6 4.2 L14.4 4.2 Z" fill="#fbbf24"/>
  <!-- Small cardinal ticks (S/E/W) -->
  <path d="M16 31.5 L17.2 28.4 L14.8 28.4 Z M0.5 16 L4.2 14.4 L4.2 17.6 Z M31.5 16 L27.8 14.4 L27.8 17.6 Z" fill="currentColor" opacity="0.55"/>
  <!-- Bold geometric R letterform -->
  <path fill="currentColor" d="M10.2 8.2h6.6c2.5 0 4.1 1.5 4.1 3.6 0 1.7-1.0 3.0-2.6 3.4L22.4 24h-3.3l-4.1-9.1H12.6V24h-2.4V8.2zm2.4 2.2v5.8h3.8c1.4 0 2.1-.85 2.1-1.9 0-1.05-.7-1.9-2.1-1.9h-3.8z"/>
</svg>
